<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reconocimiento de Objetos con Voz</title>

  <!-- Bootstrap básico -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Librerías de IA -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.5.0/dist/ml5.min.js"></script>
</head>

<a href="index.html" 
   class="btn btn-primary btn-lg rounded-pill shadow-sm"
   style="position: fixed; top: 20px; left: 20px;">
   Regresar al inicio
</a>

<body class="bg-light text-center">

  <div class="container py-4">
    <h1 class="mb-3 text-primary">Reconocimiento de Objetos</h1>
    <p class="mb-4">Modelo entrenado con Teachable Machine. Activa el sonido para escuchar el nombre del objeto detectado.</p>

    <h4 class="mb-3">Miniaturas (referencia)</h4>
    <div class="d-flex justify-content-center gap-3 flex-wrap mb-3">
      <img src="images/billetera.webp" alt="Billetera" class="rounded shadow" width="80">
      <img src="images/lapicero.webp" alt="Lapicero" class="rounded shadow" width="80">
      <img src="images/mouse.webp" alt="Mouse" class="rounded shadow" width="80">
      <img src="images/telefono.jpg" alt="Teléfono" class="rounded shadow" width="80">
      <img src="images/tijera.jpg" alt="Tijeras" class="rounded shadow" width="80">
    </div>

    <div class="form-check d-flex justify-content-center mb-4">
      <input type="checkbox" id="activarSonido" class="form-check-input me-2">
      <label for="activarSonido" class="form-check-label">Activar sonido</label>
    </div>

    <div class="mx-auto border rounded p-3 bg-white shadow" style="width: 340px;">
      <div>Teachable Machine Image Model - p5.js y ml5.js</div>
    </div>
  </div>

  <script type="text/javascript">
    let classifier;
    let imageModelURL = "./models/";
    let video;
    let flippedVideo;
    let label = "";
    let ultimaEtiquetaHablada = "";
    let checkbox = null;

    function preload() {
      classifier = ml5.imageClassifier(imageModelURL + "model.json");
    }

    // Prepara canvas, cámara, checkbox de sonido y comienza la detección
    function setup() {
      let canvas = createCanvas(320, 260);
      canvas.parent(document.querySelector(".mx-auto.border")); // Coloca el canvas dentro del recuadro
      video = createCapture(VIDEO);
      video.size(320, 240);
      video.hide();
      flippedVideo = ml5.flipImage(video);

      checkbox = document.querySelector("#activarSonido");
      checkbox.addEventListener("change", onToggleSonido);

      classifyVideo();
    }

    // Dibuja la cámara y la etiqueta detectada en tiempo real
    function draw() {
      background(0);
      image(flippedVideo, 0, 0);
      fill(255);
      textSize(16);
      textAlign(CENTER);
      text(label, width / 2, height - 4);
    }
    

    // Clasifica el frame actual de la cámara y llama a gotResult
    function classifyVideo() {
      flippedVideo = ml5.flipImage(video);
      classifier.classify(flippedVideo, gotResult);
      flippedVideo.remove();
    }

    // Maneja los resultados de la clasificación
    function gotResult(error, results) {
      if (error) {
        console.error(error);
        return;
      }

      label = results[0].label;

      if (checkbox && checkbox.checked) {
        if (label !== ultimaEtiquetaHablada) {
          speakLabel(label);
          ultimaEtiquetaHablada = label;
        }
      }

      if (checkbox && !checkbox.checked) {
        ultimaEtiquetaHablada = label;
      }

      classifyVideo();
    }

    
// Pronuncia la etiqueta usando el sintetizador de voz del navegador
    function speakLabel(texto) {
      speechSynthesis.cancel();
      if (!texto || texto.trim() === "") return;
      const mensaje = new SpeechSynthesisUtterance(texto);
      speechSynthesis.speak(mensaje);
    }

    // Controla la activación/desactivación del sonido
    function onToggleSonido(event) {
      const activo = event.target.checked;

      if (activo) {
        ultimaEtiquetaHablada = "";
        if (label && label.trim() !== "") {
          speakLabel(label);
          ultimaEtiquetaHablada = label;
        }
      } else {
        speechSynthesis.cancel();
        ultimaEtiquetaHablada = label || "";
      }
    }
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
